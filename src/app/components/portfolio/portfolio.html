<section class="portfolio section bg-tertiary">
  <div class="container">
    <h2 class="section-title">Portfolio</h2>

    <div class="portfolio-grid">
      @for (item of portfolioItems(); track item.title; let i = $index) {
        <div class="portfolio-card" [style.animation-delay]="(i * 0.1) + 's'">
          <div class="card-image">
            <img [src]="item.image" [alt]="item.title" />
            <div class="card-overlay">
              <div class="overlay-actions">
                @if (item.liveUrl) {
                  <a [href]="item.liveUrl" target="_blank" class="action-btn" aria-label="View live">
                    <mat-icon>open_in_new</mat-icon>
                  </a>
                }
                @if (item.githubUrl) {
                  <a [href]="item.githubUrl" target="_blank" class="action-btn" aria-label="View code">
                    <mat-icon>code</mat-icon>
                  </a>
                }
              </div>
            </div>
          </div>

          <div class="card-content">
            <h3 class="card-title">{{ item.title }}</h3>
            <p class="card-description">{{ item.description }}</p>

            <div class="card-tags">
              @for (tag of item.tags; track tag) {
                <span class="tag">{{ tag }}</span>
              }
            </div>
          </div>
        </div>
      }
    </div>
  </div>
</section>
