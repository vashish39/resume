<section class="education section">
  <div class="container">
    <h2 class="section-title">Education</h2>

    <div class="education-grid">
      @for (item of educationItems(); track item.degree; let i = $index) {
        <mat-card class="education-card" [style.animation-delay]="(i * 0.1) + 's'">
          <div class="card-icon">
            <mat-icon>{{ item.icon }}</mat-icon>
          </div>
          <mat-card-header>
            <mat-card-title>{{ item.degree }}</mat-card-title>
            <mat-card-subtitle>{{ item.institution }}</mat-card-subtitle>
          </mat-card-header>
          <mat-card-content>
            <div class="card-details">
              <div class="detail">
                <mat-icon>calendar_today</mat-icon>
                <span>{{ item.year }}</span>
              </div>
              <div class="detail grade">
                <mat-icon>grade</mat-icon>
                <span>{{ item.grade }}</span>
              </div>
            </div>
          </mat-card-content>
        </mat-card>
      }
    </div>
  </div>
</section>
